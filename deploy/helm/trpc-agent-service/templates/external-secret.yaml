{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "trpc-agent-service.fullname" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.externalSecret.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: TRPC_SERVICE_DATABASE_URL
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.databaseUrl }}}
    - secretKey: TRPC_SERVICE_REDIS_URL
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.redisUrl }}}
    - secretKey: TRPC_AGENT_API_KEY
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.agentApiKey }}}
    {{- if .Values.wecomAibot.enabled }}
    - secretKey: TRPC_LIVE_WECOM_AIBOT_SECRET
      remoteRef: {key: {{ .Values.secrets.externalSecret.remoteKeys.wecomAibotSecret }}}
    {{- end }}
{{- end }}
