apiVersion: batch/v1
kind: Job
metadata:
  name: trpc-agent-service-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: trpc-agent-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/example/trpc-agent-service
          args: [python, -m, trpc_service._cli, migrate]
          envFrom:
            - configMapRef: {name: trpc-agent-service}
            - secretRef: {name: trpc-agent-service-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
