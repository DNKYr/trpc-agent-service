apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-service-dispatcher
  labels: {app.kubernetes.io/component: dispatcher}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/component: dispatcher}
  template:
    metadata:
      labels: {app.kubernetes.io/component: dispatcher}
    spec:
      serviceAccountName: trpc-agent-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dispatcher
          image: ghcr.io/example/trpc-agent-service
          args: [python, -m, trpc_service._cli, dispatcher, --no-once]
          envFrom:
            - configMapRef: {name: trpc-agent-service}
            - secretRef: {name: trpc-agent-service-secrets}
          env:
            - name: TRPC_SERVICE_DISPATCHER_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
